<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulario</title>
</head>
<body>

    <form action="cadrasto.php" method="get"> </form>

   

    <p> 
     <label for="nome">Nome</label>

     <input type="text" name="nome" id="nome" required maxlength="30" placeholder="Nome completo">

    </p>

    <p>
        
    <label for="nota">Media</label>
    <input type="number" value="5" name="nota" id="nota" placeholder="Sua nota" required min="0" max="10" step="0.5">

    </p>

    <p> <label for="mes">Periodo letivo</label>
    <input type="month" name="mes" id="mes"></p>

    <p> <label for="dia"> Dia da prova</label>
    
    <input type="date" name="dia" id="dia" value="2020/07/07"></p>

    <p> <label for="hora">Hora da prova</label>
    
     <input type="time" value="12:00" name="hora" id="hora"></p>



    <p> 
        <input type="submit" value="Enviar"> 
        <input type="reset" value="Limpar">
    </p>



    
</body>
</html>
