<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela05</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {

            border-collapse: collapse;


        }

        th,td {
            border: 2px solid;
        }

        caption {
            border: 2px solid;


        }

        .amarelo {
            background-color: aqua;
        }

        .vermelho {
            background-color: blue;
        }

        .th:hover {
            background-color: aliceblue;
        }


        
        


    </style>
</head>
<body>

    <table>

        <colgroup>
            <col class="amarelo">
            <col class="vermelho">
            <col class="amarelo">
            <col class="vermelho">
        </colgroup>

        <caption>Cadrastro</caption>

        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">idade</th>
            <th scope="col">profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Adimistradora</td>

        </tr>

        <tr>
            <td>João</td>
            <td>M</td>
            <td>23</td>
            <td>Psicologo</td>
        </tr>

        <tr>
            <td>Joana</td>
            <td>F</td>
            <td>32</td>
            <td>Professora</td>
        </tr>

        <tr>
            <td>Mario</td>
            <td>M</td>
            <td>18</td>
            <td>Estudante</td>
        </tr>

        <tr>
            <td>Julio</td>
            <td>M</td>
            <td>45</td>
            <td>Balconista</td>
        </tr>












    </table>
    
</body>
</html>
