<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 300px;
       
        }

        td {
            border: 2px solid;
            padding: 10px;
        }



    </style>
</head>
<body>

    <h1>Mesclagem de celulas</h1>

    <p>colspan usa na horizontal</p>
    <p>rowspan usa na vertical</p>

    <table>

        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
            
        </tr>

        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td rowspan="2">F</td>

        </tr>

        <tr>
            
            <td>H</td>
    

        </tr>

        <tr>
            
            
            <td colspan="2">M</td>


        </tr>


















    </table>
    
</body>
</html>
