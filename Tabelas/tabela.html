<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            border: 3px solid red;
            box-shadow: 0px 0px 4px 5px rgb(173, 167, 167);
        }
        
        td {
            border: 2px solid black;
            padding: 8px;
            text-align: center;
            
        }

        tr {
            background-color: beige;
        }

        .dado {
            background-color: aqua;
            
        }

        .linha {
            background-color: beige;
        }

        .numero {
            vertical-align: top;
        }
        
        


    </style>
</head>

<h1>Tabela</h1>

<table>

    <tr class="linha">
        <td>A1</td>
        <td>B1</td>
        <td class="dado">C1</td>

    </tr>

    <tr>
        <td>A2</td>
        <td>B2</td>
        <td class="numero">C2</td>

    </tr>

    <tr>

        <td>A3</td>
        <td>B3</td>
        <td class="numero">C3</td>

    </tr>

    <tr>
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>



    </tr>





</table>
<body>
    
</body>
</html>
