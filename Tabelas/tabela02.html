<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            height: 100%vh;

        
            
        

        }

        table {
            width: 100%;

            margin-left: 2px;
            
            
            
          
            
            
        }

        td,
        th {
            border: 2px solid black;
            padding: 10px;

        }

        th {
            color: white;
        }

        thead {
            background-color: gray;
        }

        .num {
            text-align: right;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            background-color: rgb(218, 144, 47);
        }

        tfoot {
            color: aliceblue;
            background-color: rgb(39, 38, 37);
            
        }

        tbody tr:nth-child(2n) {
            background-color: rgb(161, 162, 163);
        }

        
    
    </style>

    
</head>


<body>
    
    
    <h1>Uso de tabelas grandes</h1>


    <table>
<caption>Populaçoes das unidades</caption> 

        <thead>

            <tr>

                <th>Estado</th>
                <th>População</th>

            </tr>



        </thead>

        <tbody>

            <tr>

                <td>São Paulo</td>
                <td class="num">45 519 056</td>
            </tr>

            <tr>

                <td>Minas Gerais</td>

                <td class="num" class="n2">3435454646</td>
            </tr>

            <tr>

                <td>Rio de Janeiro</td>

                <td class="num">74756475656</td>



            </tr>

            <tr>

                <td>Rio de Janeiro</td>

                <td class="num">74756475656</td>



            </tr>

            <tr>

                <td>Rio de Janeiro</td>

                <td class="num">74756475656</td>



            </tr>



        </tbody>



        <tfoot>

            <tr>

                <td>Total de habitantes</td>

                <td class="num"><strong>0000</strong></td>


            </tr>
        </tfoot>


    </table>
</body>

</html>
